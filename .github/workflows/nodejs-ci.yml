name: Intacct Node.js SDK CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        
permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]

    name: Node.js v${{ matrix.node-version }}
    
    steps:
      - name: Harden the runner
        uses: xometry/the-forge/harden-runner@harden-runner-v1
        with:
          egress-policy: audit
          jfrog_token: ${{ secrets.JFROG_TOKEN }}

      - name: Checkout 
        uses: chainguard-actions/actions-checkout@1e091f3973ecf53ab121c0f252a96e857a236ef5 # v3.6.0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: chainguard-actions/actions-setup-node@a49e154d6f0fd6d9d86f407bca5dd16191c8c1b2 # v3.9.1
        with:
          node-version: ${{ matrix.node-version }}
          
      - run: yarn --frozen-lockfile
      
      - run: yarn run build
      
      - run: yarn test
