name: 'CI'

on:
  workflow_call:
    inputs:	
      config-path:	
        required: false	
        type: string
  pull_request:
    branches:
    - main

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    
permissions:
  contents: read

jobs:
  lint-test-typecheck:
    name: 'Test'
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner
        uses: xometry/the-forge/harden-runner@harden-runner-v1
        with:
          egress-policy: audit
          jfrog_token: ${{ secrets.JFROG_TOKEN }}

      - uses: chainguard-actions/actions-checkout@1e091f3973ecf53ab121c0f252a96e857a236ef5 # v3.6.0
      - uses: chainguard-actions/actions-setup-node@a49e154d6f0fd6d9d86f407bca5dd16191c8c1b2 # v3.9.1
        with:
          node-version: 18
          cache: "yarn"
      - name: Install Dependencies
        run: |
          yarn install --frozen-lockfile
      - name: Unit Test
        run: yarn test
      - name: Type Check
        run: yarn tsc
