name: 'CI'

on:
  workflow_call:
    inputs:	
      config-path:	
        required: false	
        type: string
  pull_request:
    branches:
    - main

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    
permissions:
  contents: read

jobs:
  lint-test-typecheck:
    name: 'Test'
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: chainguard-actions/actions-setup-node@a49e154d6f0fd6d9d86f407bca5dd16191c8c1b2 # v3.9.1
        with:
          node-version: 18
          cache: "yarn"
      - name: Install Dependencies
        run: |
          yarn install --frozen-lockfile
      - name: Unit Test
        run: yarn test
      - name: Type Check
        run: yarn tsc
